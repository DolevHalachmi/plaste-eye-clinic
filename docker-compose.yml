version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: plaste-db
    environment:
      POSTGRES_DB: dr_halachmi_clinic
      POSTGRES_USER: ${DB_USERNAME:-clinic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD} # <-- Set this in Coolify UI
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clinic_user}"]
      timeout: 20s
      retries: 10
      interval: 10s
    restart: unless-stopped

  backend:
    build:
      context: ./backend/dr-halachmi-clinic
      dockerfile: Dockerfile
    container_name: plaste-backend
    environment:
      DB_URL: ${DB_URL:-jdbc:postgresql://db:5432/dr_halachmi_clinic}
      DB_USERNAME: ${DB_USERNAME:-clinic_user}
      DB_PASSWORD: ${DB_PASSWORD} # <-- Matches the DB password above
      PORT: 8080
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://dr-halachmi.com}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-https://dr-halachmi.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD} # <-- Set this in Coolify UI
      SESSION_COOKIE_SECURE: true
    expose:
      - "8080" # <-- ADDED: Tells Coolify where to route the API traffic
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: plaste-frontend
    environment:
      VITE_API_URL: ${VITE_API_URL:-https://api.dr-halachmi.com}
    expose:
      - "80" # <-- Perfect! Let Coolify handle the proxying
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data: