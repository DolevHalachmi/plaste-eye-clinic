version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: plaste-db
    environment:
      POSTGRES_DB: ${DB_NAME:-dr_halachmi_clinic}
      POSTGRES_USER: ${DB_USERNAME:-clinic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clinic_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-clinic_user}"]
      timeout: 20s
      retries: 10
      interval: 10s
    networks:
      - plaste-network
    restart: unless-stopped

  # Backend (Java/Spring Boot)
  backend:
    build:
      context: ./backend/dr-halachmi-clinic
      dockerfile: Dockerfile
    container_name: plaste-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-dr_halachmi_clinic}
      DB_USERNAME: ${DB_USERNAME:-clinic_user}
      DB_PASSWORD: ${DB_PASSWORD:-clinic_password}

      PORT: 8080

      APP_CORS_ALLOWED_ORIGINS: https://dr-halachmi.com
      APP_PUBLIC_BASE_URL: https://dr-halachmi.com

      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change_this_password}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Clinic Admin}

      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}

      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:-true}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:-true}

      SESSION_COOKIE_SECURE: true

    ports:
      - "${BACKEND_PORT:-8080}:8080"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - plaste-network

    restart: unless-stopped

  # Frontend (React/Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: plaste-frontend

    environment:
      VITE_API_URL: https://api.dr-halachmi.com

    ports:
      - "5173:5173"

    depends_on:
      - backend

    networks:
      - plaste-network

    restart: unless-stopped

volumes:
  db_data:
    driver: local

networks:
  plaste-network:
    driver: bridge