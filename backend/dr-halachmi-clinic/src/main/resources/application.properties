# Loads local secrets if you keep a private override file outside Git.
spring.config.import=optional:application-local.properties

spring.application.name=dr-halachmi-clinic

# Uses environment variables in production and safe local defaults for development.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:4321/database}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${PORT:8080}

# Allows the deployed frontend URL to be swapped in without editing tracked files.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.seed.username=${ADMIN_USERNAME:admin}
app.admin.seed.password=${ADMIN_PASSWORD:change-me-now}
app.admin.seed.display-name=${ADMIN_DISPLAY_NAME:Clinic Admin}
