# Loads local secrets if you keep a private override file outside Git.
spring.config.import=optional:application-local.properties

spring.application.name=dr-halachmi-clinic

# Reads database credentials from the environment or a private local override file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.address=0.0.0.0
server.port=${PORT:8080}

# Allows the deployed frontend URL to be swapped in without editing tracked files.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.seed.username=${ADMIN_USERNAME:}
app.admin.seed.password=${ADMIN_PASSWORD:}
app.admin.seed.display-name=${ADMIN_DISPLAY_NAME:Clinic Admin}
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
app.answer-notifications.from=${ANSWER_NOTIFICATION_FROM:noreply@dr-halachmi.com}

# Resend API key for answer-notification emails.
# Set RESEND_API_KEY in Render. Leave blank locally to skip sending.
resend.api-key=${RESEND_API_KEY:}

# Keeps the admin session cookie locked down and lets production force HTTPS-only cookies.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Actuator endpoints for health checks and monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
