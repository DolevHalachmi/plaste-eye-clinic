# Loads local secrets if you keep a private override file outside Git.
spring.config.import=optional:application-local.properties

spring.application.name=dr-halachmi-clinic

# Reads database credentials from the environment or a private local override file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${PORT:8080}

# Allows the deployed frontend URL to be swapped in without editing tracked files.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.seed.username=${ADMIN_USERNAME:}
app.admin.seed.password=${ADMIN_PASSWORD:}
app.admin.seed.display-name=${ADMIN_DISPLAY_NAME:Clinic Admin}

# Keeps the admin session cookie locked down and lets production force HTTPS-only cookies.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
