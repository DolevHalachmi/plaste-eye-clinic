# Loads local secrets if you keep a private override file outside Git.
spring.config.import=optional:application-local.properties

spring.application.name=dr-halachmi-clinic

# Reads database credentials from the environment or a private local override file.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

server.port=${PORT:8080}

# Allows the deployed frontend URL to be swapped in without editing tracked files.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.admin.seed.username=${ADMIN_USERNAME:}
app.admin.seed.password=${ADMIN_PASSWORD:}
app.admin.seed.display-name=${ADMIN_DISPLAY_NAME:Clinic Admin}
app.public.base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
app.answer-notifications.from=${ANSWER_NOTIFICATION_FROM:${spring.mail.username:}}

# Mail settings for answer-notification emails.
# For local testing, prefer putting real values in application-local.properties or environment variables.
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_CONNECTIONTIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_WRITETIMEOUT:5000}

# Keeps the admin session cookie locked down and lets production force HTTPS-only cookies.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Actuator endpoints for health checks and monitoring
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
